name: Android-app bouwen

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      versie:
        description: 'Versienummer voor een release, bijv. 1.3 (leeg laten = alleen bouwen)'
        required: false
        default: ''

permissions:
  contents: write # nodig om een release (en de bijbehorende tag) aan te maken

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Versie bepalen
        env:
          VERSIE: ${{ inputs.versie }}
        run: |
          echo "VOER_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          if [ -n "$VERSIE" ]; then
            # Release via "Run workflow" met een versienummer
            if ! [[ "$VERSIE" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
              echo "::error::Ongeldig versienummer '$VERSIE' (gebruik bijv. 1.3)."
              exit 1
            fi
            echo "VOER_VERSION_NAME=$VERSIE" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=v$VERSIE" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VOER_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "VOER_VERSION_NAME=build.${{ github.run_number }}" >> "$GITHUB_ENV"
          fi

      - name: Ondertekensleutel klaarzetten
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/voer-app-release.jks"
            echo "VOER_KEYSTORE_FILE=$RUNNER_TEMP/voer-app-release.jks" >> "$GITHUB_ENV"
          elif [ -n "${RELEASE_TAG:-}" ]; then
            echo "::error::Geen ondertekensleutel ingesteld; voeg de secrets toe (zie android/README.md)."
            exit 1
          else
            echo "::warning::Geen ondertekensleutel ingesteld (secret ANDROID_KEYSTORE_BASE64). Er wordt een debug-APK gebouwd die je niet over een eerdere versie heen kunt installeren."
          fi

      - name: APK bouwen
        env:
          VOER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VOER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VOER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${VOER_KEYSTORE_FILE:-}" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk voer-app.apk
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk voer-app.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: voer-app-${{ env.VOER_VERSION_NAME }}
          path: android/voer-app.apk

      - name: Release maken
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Voer-app ${{ env.VOER_VERSION_NAME }}
          files: android/voer-app.apk
