name: Android-app bouwen

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      versie:
        description: 'Versienummer voor een release, bijv. 1.3 (leeg laten = alleen bouwen)'
        required: false
        default: ''

# Standaard alleen lezen; alleen de release-job krijgt schrijfrechten
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      version_name: ${{ steps.version.outputs.version_name }}
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Versie bepalen
        id: version
        env:
          VERSIE: ${{ inputs.versie }}
        run: |
          echo "VOER_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          if [ -n "$VERSIE" ]; then
            # Release via "Run workflow" met een versienummer
            if ! [[ "$VERSIE" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
              echo "::error::Ongeldig versienummer '$VERSIE' (gebruik bijv. 1.3)."
              exit 1
            fi
            echo "VOER_VERSION_NAME=$VERSIE" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=v$VERSIE" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if ! [[ "${GITHUB_REF_NAME#v}" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
              echo "::error::Ongeldige versietag '$GITHUB_REF_NAME' (gebruik bijv. v1.3)."
              exit 1
            fi
            echo "VOER_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "VOER_VERSION_NAME=build.${{ github.run_number }}" >> "$GITHUB_ENV"
          fi
          grep -E '^(VOER_VERSION_NAME|RELEASE_TAG)=' "$GITHUB_ENV" | sed 's/^VOER_VERSION_NAME/version_name/; s/^RELEASE_TAG/release_tag/' >> "$GITHUB_OUTPUT"

      - name: Ondertekensleutel klaarzetten
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/voer-app-release.jks"
            echo "VOER_KEYSTORE_FILE=$RUNNER_TEMP/voer-app-release.jks" >> "$GITHUB_ENV"
          elif [ -n "${RELEASE_TAG:-}" ]; then
            echo "::error::Geen ondertekensleutel ingesteld; voeg de secrets toe (zie android/README.md)."
            exit 1
          else
            echo "::warning::Geen ondertekensleutel ingesteld (secret ANDROID_KEYSTORE_BASE64). Er wordt een debug-APK gebouwd die je niet over een eerdere versie heen kunt installeren."
          fi

      - name: APK bouwen
        env:
          VOER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VOER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VOER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${VOER_KEYSTORE_FILE:-}" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk voer-app.apk
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk voer-app.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: voer-app-${{ env.VOER_VERSION_NAME }}
          path: android/voer-app.apk

  release:
    needs: build
    if: needs.build.outputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: voer-app-${{ needs.build.outputs.version_name }}

      - name: Release maken
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.release_tag }}
          TITLE: Voer-app ${{ needs.build.outputs.version_name }}
        run: |
          gh release create "$TAG" voer-app.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TITLE" --notes "Installeer voer-app.apk op je telefoon, over de vorige versie heen."
